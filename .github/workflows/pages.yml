# Builds the demos and publishes them to GitHub Pages: /case-1/ (static page), /case-2/ (and the index at /).
# Turn it on in the repository settings: Pages -> Build and deployment -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: assemble the site
        run: |
          mkdir -p _site/case-1 _site/case-2
          cp site/index.html _site/
          # case 1 is an Android app: a static page with its recording and charts, no build
          cp site/case-1/index.html _site/case-1/
          cp cases/01-detail-transition/docs/case1-ab.gif cases/01-detail-transition/docs/case1-*.svg _site/case-1/
          cp -r cases/02-infinite-scroll/dist/. _site/case-2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
